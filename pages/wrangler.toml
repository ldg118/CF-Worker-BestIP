name = "cf-best-ip"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "cf-best-ip-db"
database_id = ""

[[kv_namespaces]]
binding = "KV"
id = ""
preview_id = ""

[vars]
# 安全：不要把密码写在这里（本文件会进仓库）。
# 请用 `wrangler secret put ADMIN_PASSWORD`，或在 Cloudflare 面板 Settings -> Variables 配置。
# 未配置时后台将无法登录 —— 这是有意的设计。
DEFAULT_IP_COUNT = "3"
DEFAULT_TEST_COUNT = "50"
DEFAULT_THREAD_COUNT = "10"
DEFAULT_BANDWIDTH_FILE_SIZE = "3"
FAILED_IP_COOLDOWN_DAYS = "15"
MAX_HIGH_QUALITY_POOL_SIZE = "30"

[site]
bucket = "./public"